name: cpp-api-gateway
services:
  redis:
    image: redis:7.4-alpine
    container_name: cpp-api-gateway-redis
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - gateway
  backend-1:
    build:
      context: ./backend
    image: cpp-api-gateway-backend:local
    container_name: cpp-api-gateway-backend-1
    command:
    - --host
    - 0.0.0.0
    - --port
    - '9001'
    - --name
    - backend-1
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health',
        timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - gateway
  backend-2:
    build:
      context: ./backend
    image: cpp-api-gateway-backend:local
    container_name: cpp-api-gateway-backend-2
    command:
    - --host
    - 0.0.0.0
    - --port
    - '9002'
    - --name
    - backend-2
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9002/health',
        timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: cpp-api-gateway:local
    container_name: cpp-api-gateway
    depends_on:
      redis:
        condition: service_healthy
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    environment:
      GATEWAY_PORT: '8080'
      BACKENDS: backend-1:9001,backend-2:9002
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      RATE_LIMITING_ENABLED: 'true'
      RATE_LIMIT_CAPACITY: '100000'
      RATE_LIMIT_REFILL_RATE: '100000'
      LOAD_BALANCING_STRATEGY: ROUND_ROBIN
      BACKEND_CONNECT_TIMEOUT_MS: '2000'
      BACKEND_RESPONSE_TIMEOUT_MS: '5000'
      REQUEST_TIMEOUT_MS: '10000'
      SHUTDOWN_GRACE_PERIOD_MS: '5000'
    ports:
    - ${GATEWAY_HOST_PORT:-8080}:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:$${GATEWAY_PORT}/api/status || exit 1
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - gateway
  prometheus:
    image: prom/prometheus:latest
    container_name: cpp-api-gateway-prometheus
    depends_on:
      gateway:
        condition: service_started
    volumes:
    - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - ${PROMETHEUS_HOST_PORT:-9090}:9090
    networks:
    - gateway
  grafana:
    image: grafana/grafana:latest
    container_name: cpp-api-gateway-grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
    - ${GRAFANA_HOST_PORT:-3000}:3000
    volumes:
    - grafana_data:/var/lib/grafana
    - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
    - gateway
volumes:
  prometheus_data: null
  grafana_data: null
networks:
  gateway:
    driver: bridge
